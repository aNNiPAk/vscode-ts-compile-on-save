
name: Apply Patch and Build on Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable long paths in Git
        run: |
          git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone original VSCode repository
        run: |
          git -c core.longpaths=true clone --depth=1 --branch=main https://github.com/microsoft/vscode.git D:\v

      - name: Prepare Node.js and pnpm metadata
        shell: pwsh
        run: |
          Copy-Item "D:\v\.nvmrc" "$env:GITHUB_WORKSPACE\.nvmrc"
          Copy-Item "D:\v\pnpm-lock.yaml" "$env:GITHUB_WORKSPACE\pnpm-lock.yaml"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install required dependencies
        working-directory: D:\v
        run: pnpm install --frozen-lockfile
        env:
          VSCODE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - name: Copy patch into cloned repository
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\ts-compile-on-save.patch" "D:\v\ts-compile-on-save.patch"

      - name: Apply patch
        working-directory: D:\v
        run: |
          git apply ts-compile-on-save.patch

      - name: Restrict extension build to TypeScript language features
        shell: pwsh
        run: |
          $file = "D:\v\build\lib\extensions.ts"
          $text = Get-Content $file -Raw

          $needle = ".filter(({ name }) => native ? nativeExtensionsSet.has(name) : !nativeExtensionsSet.has(name))"
          $replacement = ".filter(({ name }) => name === 'typescript-language-features')`r`n`t`t`t.filter(({ name }) => native ? nativeExtensionsSet.has(name) : !nativeExtensionsSet.has(name))"

          if ($text.Contains("name === 'typescript-language-features'")) {
            Write-Host "Extension filter already applied."
          }
          elseif ($text.Contains($needle)) {
            $text = $text.Replace($needle, $replacement)
            Set-Content $file $text -NoNewline -Encoding utf8
            Write-Host "Extension filter applied."
          }
          else {
            throw "Cannot find extension filter in build/lib/extensions.ts"
          }

          git -C D:\v diff -- build/lib/extensions.ts

      - name: Build TypeScript language features dist
        working-directory: D:\v
        run: |
          npm run compile-extensions-build
        env:
          VSCODE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - name: List artifact contents
        shell: pwsh
        run: |
          Write-Host "Contents of .build/extensions:"
          Get-ChildItem "D:\v\.build\extensions"

          Write-Host "Contents of TypeScript language features:"
          Get-ChildItem "D:\v\.build\extensions\typescript-language-features"

          Write-Host "Contents of dist:"
          Get-ChildItem "D:\v\.build\extensions\typescript-language-features\dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-language-features-dist
          path: D:\v\.build\extensions\typescript-language-features\dist\
          if-no-files-found: error
